<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger - Razorpay Test Checkout</title>
</head>

<body>
    <h1>Ledger — Razorpay Test Payment</h1>
    <p>Test Mode only. No real money is charged.</p>

    <button id="pay-button">Pay ₹100</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const options = {
            key: "rzp_test_TSWvHXpymmlLx0",

            amount: 10000,
            currency: "INR",

            name: "Ledger Test Merchant",
            description: "Ledger foundation test payment",

            order_id: "order_TSX7oPb88BBxoO",

            handler: function (response) {
                console.log(
                    "Payment ID:",
                    response.razorpay_payment_id
                );

                console.log(
                    "Order ID:",
                    response.razorpay_order_id
                );

                console.log(
                    "Signature:",
                    response.razorpay_signature
                );

                document.body.innerHTML += `
                    <h2>Payment successful</h2>
                    <p>
                        Payment ID:
                        ${response.razorpay_payment_id}
                    </p>
                    <p>
                        Order ID:
                        ${response.razorpay_order_id}
                    </p>
                    <p>
                        Signature returned successfully.
                    </p>
                `;
            },

            prefill: {
                name: "Ledger Test User",
                email: "test@example.com",
                contact: "9999999999"
            },

            theme: {
                color: "#3399cc"
            }
        };

        const razorpay = new Razorpay(options);

        document.getElementById("pay-button").onclick = function (event) {
            razorpay.open();
            event.preventDefault();
        };
    </script>
</body>
</html>
