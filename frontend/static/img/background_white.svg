<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(71, 85, 105, 0.09)" stroke-width="1"/>
    </pattern>

    <!-- Top Glow Gradient -->
    <radialGradient id="top-glow" cx="50%" cy="15%" r="45%" fx="50%" fy="15%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- Radial Mask for Grid -->
    <radialGradient id="grid-mask-grad" cx="50%" cy="20%" r="50%">
      <stop offset="30%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1920" height="1080" fill="url(#grid-mask-grad)"/>
    </mask>
  </defs>

  <!-- Base Solid Background -->
  <rect width="100%" height="100%" fill="#EBF0F5"/>

  <!-- Radial Glow Layer -->
  <rect width="100%" height="100%" fill="url(#top-glow)"/>

  <!-- Masked Grid Pattern -->
  <rect width="100%" height="100%" fill="url(#grid)" mask="url(#grid-mask)"/>
</svg>